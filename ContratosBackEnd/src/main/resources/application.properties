spring.application.name=contratos-backend
server.port=${SERVER_PORT:8080}
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:5184000}
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=150MB

# Notificações automáticas de vencimento
notifications.first-alert-months=${NOTIFICATIONS_FIRST_ALERT_MONTHS:6}
notifications.second-alert-months=${NOTIFICATIONS_SECOND_ALERT_MONTHS:4}
notifications.mail.enabled=${NOTIFICATIONS_MAIL_ENABLED:false}
notifications.mail.from=${NOTIFICATIONS_MAIL_FROM:naoresponda@cisbaf.org.br}
# Lista de segurança para testes (e-mails separados por vírgula). Preenchida: SÓ estes recebem. Vazia: sem restrição.
notifications.mail.allowed-recipients=${NOTIFICATIONS_MAIL_ALLOWED_RECIPIENTS:}
# Intervalo mínimo entre dois e-mails reais, em milissegundos (0 desliga). Ajuda a não cair em spam.
notifications.mail.delay-ms=${NOTIFICATIONS_MAIL_DELAY_MS:3000}
notifications.cron=${NOTIFICATIONS_CRON:0 0 8 * * *}

spring.mail.host=${MAIL_HOST:smtp.skymail.net.br}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:naoresponda@cisbaf.org.br}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
management.health.mail.enabled=false
