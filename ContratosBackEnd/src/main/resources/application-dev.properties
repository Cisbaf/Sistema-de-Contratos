spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:contratos}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

app.bootstrap-admin.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.bootstrap-admin.email=${ADMIN_EMAIL:admin@cisbaf.org.br}
app.bootstrap-admin.password=${ADMIN_PASSWORD:admin123}
app.bootstrap-admin.name=${ADMIN_NAME:Administrador}
app.bootstrap-admin.sector=${ADMIN_SECTOR:Administração}
