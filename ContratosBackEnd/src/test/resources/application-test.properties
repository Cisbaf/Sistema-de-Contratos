spring.datasource.url=jdbc:h2:mem:contratos;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-secret-key-with-at-least-32-characters-long
jwt.cookie-secure=false

app.bootstrap-admin.enabled=true
app.bootstrap-admin.email=admin@test.local
app.bootstrap-admin.password=admin123
app.bootstrap-admin.name=Administrador de Teste
app.bootstrap-admin.sector=Administração

# Anexos (ANX-10): pasta temporária fora do projeto, uma por contexto Spring de teste (o uuid evita que
# os ids de contrato, que se repetem entre os H2 isolados, compartilhem pasta).
attachments.storage-dir=${java.io.tmpdir}/contratos-test-anexos-${random.uuid}

# CORS (COR-10): origem padrão dos testes; CorsIntegrationTest sobrescreve com duas origens.
cors.allowed-origins=http://localhost:3000
